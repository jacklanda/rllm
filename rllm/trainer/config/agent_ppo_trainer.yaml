hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

actor_rollout_ref:
  rollout:
    mode: async
    agent:
      num_workers: 0
    val_kwargs:
      do_sample: True
      #max_val_num: -1  # Maximum number of validation batches to use (-1 = use all)

data:
  shuffle_data: True
  gen_batch_size: ${mul:${data.train_batch_size},${rllm.rejection_sample.multiplier}}
  return_multi_modal_inputs: False
  max_response_length: 32768

rllm:
  agent:
    name: math_agent
    max_steps: 32
    cli_max_steps: 80        # CLI tasks get a larger step budget; null = use max_steps for all
    trajectory_timeout: null
    overlong_filter: False
    agent_args: {}
    engine_args: {}
  env:
    name: custom
    env_args: {}
  workflow:
    use_workflow: False
    name: single_turn_workflow
    workflow_args:
      agent_cls: null
      agent_args: {}
      env_cls: null
      env_args: {}
      timeout: 1e6
      gamma: 0.0 # no discounting
      reward_bonus_coeff: 0.0 # no reward shaping
    n_parallel_tasks: 512
    retry_limit: 8
  disable_thinking: False
  accumulate_reasoning: False
  mask_truncated_samples: True
  filter_token_mismatch: True
  incremental_tokenization: False
  stepwise_advantage:
    enable: False
    mode: broadcast # [broadcast, per_step]
    normalize_by_steps: False
  compact_filtering:
    enable: True
    mask_max_prompt_length_exceeded: True
    mask_max_response_length_exceeded: True
    mask_env_done: False
    mask_max_turns_exceeded: True
    mask_timeout: True
    mask_unknown: True
    mask_error: True
  trajectory_filtering:
    # SimpleTIR-style trajectory-level filtering for search agents
    # Filters out individual trajectories from batches before gradient updates
    enable: False
    max_step_retries: 8

    # 5.4.1: Model-induced anomalies (Break + 0 Reward)
    max_tool_calls_per_turn: 10      # Filter if assistant makes >N tool calls in a single turn

    # 5.4.3: Exceeding search turn limit (Stop + 0 Reward)
    max_search_turns: null           # Filter trajectories exceeding N search turns (null = disabled)

    # 5.4.4: Exceeding maximum token count (Compute advantages, no gradients)
    max_tokens: null                 # Mark trajectories >N tokens as no_grad (null = disabled)

    # Note: The following are automatically detected and do not require configuration:
    # - Tool parse errors (unclosed <think> tags, malformed JSON, etc.)
    # - Repeated queries (identical search queries within a trajectory)
    # - Search errors (environment timeouts, retrieval errors, etc.)
  rejection_sample:
    enable: True
    multiplier: 1
    filter_high_variance: False
    max_uid_reward_std: null
    filter_verifier_missing: False
    filter_zero_variance: False   # Drop groups where all rewards are identical (zero GRPO gradient)
  curriculum_filter:
    # Quarantine CLI/SWE tasks that look unsolvable or infra-broken. When a task's
    # group of ``rollout.n`` returns the same non-zero ``omnigril_exit_code`` for
    # ``consecutive_steps`` in a row, its task_id is added to an on-disk blocklist
    # and all future rollouts of that task are dropped from training (advantage = 0,
    # masked from loss). This implements the cheaper "all-rollouts-identical"
    # proxy described in the RL env stability guideline; the full offline
    # dry-run (run eval_script with zero edits) is implemented by
    # ``experiments/artifacts/cli_data_20260429/convert_to_parquet.py`` when it
    # is invoked with ``--curriculum-filter``.
    enable: False
    consecutive_steps: 3          # Quarantine after N consecutive all-identical-exit steps
    apply_to_sources: ["cli"]     # Which data_source values to watch
    blocklist_path: null          # null → <checkpoint_dir>/curriculum_blocklist.json
  cli_diversity:
    # P2 — CLI task diversity per batch.
    # When enabled, after the standard ``batch.repeat(n=rollout.n, interleave=True)``
    # step, the CLI slice of each batch is re-balanced: each CLI task keeps at most
    # ``max_rollouts_per_task`` rollouts. If other CLI tasks are available in the
    # dataloader's current step, empty slots are filled by duplicating their
    # rollouts instead (same rollout.n, wider task support). A no-op when the
    # batch already has enough diversity.
    enable: False
    max_rollouts_per_task: 8
  distill:
    enable: False
    shared_tokenizer: False
    teacher_rollout_args:
      model: "default"
      base_url: "http://localhost:8000/v1"
      api_key: "EMPTY"
      max_prompt_length: 2048
  sdk:
    store:
      path: ~/.rllm/traces.db
    processing:
      groupby_key: null
      traj_name_key: null
    proxy:
      host: 127.0.0.1
      port: 4000
      mode: subprocess  # external | subprocess
      admin_token: my-shared-secret

fireworks:
  deployment_id: null
  model_id_prefix: test-model
  concurrency: 32
  return_token_ids: True

trainer:
  run_id: null
  log_episodes: false
  episode_log_dir: experiments/logs/${trainer.project_name}/${trainer.experiment_name}

# Reward configuration for search agents
reward:
  # Tool call bonus/penalty configuration
  toolcall_bonus: 0.5                    # Bonus for single good tool call, penalty for invalid/multiple

  # Repetition penalty configuration
  apply_repetition_penalty: false        # Enable repetition penalty
  repetition_penalty_weight: 0.5         # Weight for repetition penalty
  repetition_max_n: 4                    # Maximum n-gram length for detection

  # Base reward values
  correct_reward: 1.0                    # Reward for correct answers
  incorrect_reward: 0.0                  # Reward for incorrect answers
